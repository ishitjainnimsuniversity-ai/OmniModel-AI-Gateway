<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>GENESIS AI — Dual Brain System</title>
<style>
:root{--bg:#050b18;--panel:#0b1426;--line:#18304f;--cyan:#22d3ee;--blue:#3b82f6;--text:#e6f1ff;--dim:#7d93b2;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--purple:#a855f7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 50% -10%,#0c2347 0%,var(--bg) 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:rgba(5,11,24,.9);backdrop-filter:blur(8px);flex-wrap:wrap}
header svg{width:28px;height:28px;flex:none}
.brand{font-weight:900;letter-spacing:.12em;font-size:14px;color:var(--cyan)}
.sub{font-size:11px;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--text);border:1px solid var(--line);border-radius:99px;padding:3px 8px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.local{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.dot.busy{background:var(--warn);animation:pulse 1s infinite}
.ctrls{display:flex;gap:5px;align-items:center}
select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
select{outline:none}
button:active{background:#12274a}
main{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.empty{margin:auto;text-align:center;color:var(--dim);max-width:340px;padding:16px}
.empty svg{width:76px;height:76px;margin-bottom:8px}
.empty h2{color:var(--text);font-size:17px;margin-bottom:4px}
.badge-row{display:flex;gap:6px;justify-content:center;margin:10px 0}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;border:1px solid var(--line);letter-spacing:.05em}
.badge.local{border-color:var(--cyan);color:var(--cyan);background:#071d2b}
.badge.cloud{border-color:var(--ok);color:var(--ok);background:#06231c}
.sugg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.sugg button{font-size:12px;border-radius:99px;color:var(--cyan)}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.me{align-self:flex-end;background:linear-gradient(135deg,#0e4a6b,#12306b);border:1px solid #1d5a85;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai.err{border-color:#7f1d1d;background:#220d12;color:#fecaca}
.meta{font-size:10px;font-weight:700;color:var(--dim);margin-top:6px;display:flex;align-items:center;gap:6px}
.meta span{padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.meta .tag-local{border-color:var(--cyan);color:var(--cyan)}
.meta .tag-cloud{border-color:var(--ok);color:var(--ok)}
.meta .tag-fb{border-color:var(--warn);color:var(--warn)}
.ai pre{background:#030712;border:1px solid var(--line);border-radius:8px;padding:9px;margin:8px 0;overflow-x:auto;font:13px/1.45 ui-monospace,Consolas,monospace;white-space:pre}
.ai code{font:13px ui-monospace,Consolas,monospace;background:#030712;padding:1px 5px;border-radius:5px}
.ai pre code{background:none;padding:0}
.think{display:inline-flex;gap:5px;padding:4px 0}
.think i{width:8px;height:8px;border-radius:50%;background:var(--cyan);animation:bounce 1.2s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
@keyframes pulse{50%{opacity:.35}}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(5,11,24,.94)}
textarea{flex:1;resize:none;max-height:140px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;outline:none}
textarea:focus{border-color:var(--cyan)}
#send{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#02131f;font-weight:800;border:0;border-radius:12px;padding:0 16px}
#send:disabled{opacity:.45}
.modal{position:fixed;inset:0;background:rgba(2,6,15,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%}
.card h3{margin-bottom:6px;font-size:16px}.card p{color:var(--dim);font-size:12px;margin-bottom:10px}
.card input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#030712;color:var(--text);font:inherit;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-label="GENESIS AI">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#g)" stroke-width="3"/>
    <ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="url(#g)" stroke-width="2" transform="rotate(35 32 32)"/>
    <ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="url(#g)" stroke-width="2" transform="rotate(-35 32 32)"/>
    <circle cx="32" cy="32" r="6" fill="url(#g)"/>
  </svg>
  <div class="grow">
    <div class="brand">GENESIS AI</div>
    <div class="sub" id="model">Dual Brain connecting...</div>
  </div>
  <div class="ctrls">
    <select id="modeSel" title="Brain Mode">
      <option value="auto">Auto (Cloud+Ollama)</option>
      <option value="local">Offline (Ollama Only)</option>
      <option value="cloud">Cloud Only</option>
    </select>
    <div class="chip"><span class="dot" id="dot"></span><span id="state">OFFLINE</span></div>
    <button id="newBtn" title="New conversation">New</button>
  </div>
</header>
<main id="log"></main>
<form id="f">
  <textarea id="q" rows="1" placeholder="Ask anything (Local Ollama or Cloud)..." autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<div class="modal" id="auth"><div class="card">
  <h3>Enter Access Code</h3>
  <p>Saved in backend .env as GENESIS_ACCESS_TOKEN.</p>
  <input id="tok" type="password" placeholder="Access code" autocomplete="off">
  <button id="tokOk" style="width:100%">Connect</button>
</div></div>
<script>
const $ = s => document.querySelector(s);
const log = $('#log'), q = $('#q'), send = $('#send'), dot = $('#dot'), stateEl = $('#state'), modelEl = $('#model'), modeSel = $('#modeSel');
let token = localStorage.getItem('genesis_token') || '', cid = localStorage.getItem('genesis_cid') || '', busy = false;
const urlTok = new URLSearchParams(window.location.search).get('token');
if (urlTok) { token = urlTok.trim(); localStorage.setItem('genesis_token', token); }
const H = () => ({'Content-Type':'application/json','X-Genesis-Token':token});

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(src){
  let t = esc(src), blocks = [];
  t = t.replace(/```[\w+-]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000'});
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
       .replace(/^#{1,6}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ');
  return t.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[+i]);
}
function empty(localOk, cloudOk){
  log.innerHTML = `<div class="empty">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#22d3ee" stroke-width="2"/><ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="#3b82f6" stroke-width="2" transform="rotate(35 32 32)"/><ellipse cx="32" cy="32" rx="28" ry="11" fill="none" stroke="#3b82f6" stroke-width="2" transform="rotate(-35 32 32)"/><circle cx="32" cy="32" r="6" fill="#22d3ee"/></svg>
    <h2>GENESIS Dual Brain Active</h2>
    <div class="badge-row">
      <span class="badge ${localOk?'local':''}">${localOk?'LOCAL AI AVAILABLE':'LOCAL OLLAMA OFF'}</span>
      <span class="badge ${cloudOk?'cloud':''}">${cloudOk?'CLOUD AI AVAILABLE':'CLOUD OFFLINE'}</span>
    </div>
    <div style="font-size:12px;margin-top:6px">Works 100% offline via Ollama and connects to Cloud AI when internet is online. Answers sync with the ESP32-C5 screen.</div>
    <div class="sugg"></div>
  </div>`;
  ['Explain how neural networks learn','Write a python function to compute factorial','Calculate 48 * 25 + 120 directly','Summarise causes of the French Revolution'].forEach(t=>{
    const b=document.createElement('button');b.textContent=t;b.onclick=()=>{q.value=t;f.requestSubmit()};log.querySelector('.sugg').appendChild(b)});
}
function add(cls, html){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function setBusy(b, brainLabel){busy=b;send.disabled=b;if(b){dot.className='dot busy';stateEl.textContent=brainLabel||'THINKING'}}

async function health(){
  try{
    const r = await fetch('/api/health?deep=1',{cache:'no-store'}); const j = await r.json();
    const isCloud = (j.active_brain === 'CLOUD');
    const isLocal = (j.active_brain === 'LOCAL');
    modelEl.textContent = isCloud ? `[CLOUD] ${j.cloud_model}` : (isLocal ? `[LOCAL] ${j.local_model}` : 'NO BRAIN READY');
    if(!busy){
      if(isCloud){dot.className='dot on';stateEl.textContent='ONLINE';}
      else if(isLocal){dot.className='dot local';stateEl.textContent='OFFLINE (LOCAL)';}
      else {dot.className='dot';stateEl.textContent='OFFLINE (NO BRAIN)';}
    }
    modeSel.value = j.mode_preference || 'auto';
    return j;
  }catch(e){
    if(!busy){dot.className='dot';stateEl.textContent='BACKEND DOWN';modelEl.textContent='backend unreachable';}
    return null;
  }
}
async function loadHistory(){
  const h = await health();
  if(!cid) return empty(h?.local_ai_available, h?.cloud_ai_available);
  try{
    const r = await fetch('/api/conversations/'+cid,{headers:H()});
    if(r.status===401){return askToken()}
    if(!r.ok){cid='';localStorage.removeItem('genesis_cid');return empty(h?.local_ai_available, h?.cloud_ai_available)}
    const j = await r.json(); log.innerHTML='';
    if(!j.messages.length) return empty(h?.local_ai_available, h?.cloud_ai_available);
    j.messages.forEach(m=>add(m.role==='user'?'me':'ai', m.role==='user'?esc(m.content):md(m.content)));
  }catch(e){empty(h?.local_ai_available, h?.cloud_ai_available)}
}
function askToken(){$('#auth').classList.add('show');$('#tok').focus()}
$('#tokOk').onclick=()=>{token=$('#tok').value.trim();localStorage.setItem('genesis_token',token);$('#auth').classList.remove('show');loadHistory()};

modeSel.onchange = async () => {
  try{
    await fetch('/api/system/mode?mode='+modeSel.value,{method:'POST',headers:H()});
    health();
  }catch(e){}
};

async function ask(text){
  if(!log.querySelector('.msg')) log.innerHTML='';
  add('me', esc(text)); const bubble = add('ai','<span class="think"><i></i><i></i><i></i></span>');
  setBusy(true, 'THINKING'); let full='', metaInfo='';
  try{
    const r = await fetch('/api/chat/stream',{method:'POST',headers:H(),body:JSON.stringify({message:text,conversation_id:cid||null})});
    if(r.status===401){bubble.remove();askToken();return}
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf='';
    while(true){
      const {done,value} = await rd.read(); if(done) break;
      buf += dec.decode(value,{stream:true}); let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const line = buf.slice(0,i).trim(); buf = buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        const ev = JSON.parse(line.slice(5));
        if(ev.type==='start'){cid=ev.conversation_id;localStorage.setItem('genesis_cid',cid)}
        else if(ev.type==='meta'){
          stateEl.textContent = (ev.brain==='LOCAL'?'LOCAL THINKING':'CLOUD THINKING');
          const tagCls = (ev.brain==='LOCAL'?'tag-local':'tag-cloud');
          metaInfo = `<div class="meta"><span class="${tagCls}">${esc(ev.brain)} BRAIN</span><span>${esc(ev.provider)}/${esc(ev.model)}</span>${ev.fallback?'<span class="tag-fb">CLOUD FAILOVER</span>':''}</div>`;
        }
        else if(ev.type==='delta'){full+=ev.text;bubble.innerHTML=md(full);log.scrollTop=log.scrollHeight;}
        else if(ev.type==='done'){
          const tagCls = (ev.brain==='LOCAL'?'tag-local':'tag-cloud');
          metaInfo = `<div class="meta"><span class="${tagCls}">${esc(ev.brain)} BRAIN</span><span>${esc(ev.provider)}/${esc(ev.model)}</span>${ev.fallback?'<span class="tag-fb">CLOUD FAILOVER</span>':''}</div>`;
          bubble.innerHTML = md(ev.text) + metaInfo;
        }
        else if(ev.type==='error'){bubble.classList.add('err');bubble.innerHTML=esc((full?full+'\n\n':'')+'Error: '+ev.message)}
      }
    }
  }catch(e){bubble.classList.add('err');bubble.textContent='Error: could not reach backend ('+e.message+')'}
  setBusy(false); health();
}
const f = $('#f');
f.onsubmit = e => {e.preventDefault(); const t=q.value.trim(); if(!t||busy) return; q.value=''; q.style.height='auto'; ask(t)};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});
q.addEventListener('input',()=>{q.style.height='auto';q.style.height=Math.min(q.scrollHeight,140)+'px'});
$('#newBtn').onclick = async()=>{
  if(busy) return;
  try{const r=await fetch('/api/conversations',{method:'POST',headers:H()}); if(r.status===401) return askToken(); cid=(await r.json()).id; localStorage.setItem('genesis_cid',cid)}catch(e){cid='';localStorage.removeItem('genesis_cid')}
  empty();
};
if(!token) askToken(); loadHistory(); health(); setInterval(health,8000);
</script>
</body>
</html>
